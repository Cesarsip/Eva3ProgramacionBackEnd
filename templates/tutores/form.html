{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block page_title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>{{ titulo }}</h1>
    <p>Completa los datos de contacto del tutor responsable.</p>
  </div>
  <a class="btn btn-outline-secondary" href="{% url 'tutores_lista' %}"><i class="bi bi-arrow-left me-1"></i>Volver</a>
</div>

<div class="card-petcare" style="max-width: 860px;">
  <div class="card-body p-4">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include 'includes/campos_form.html' %}
      <div class="d-flex gap-2 justify-content-end mt-4">
        <a class="btn btn-light border" href="{% url 'tutores_lista' %}">Cancelar</a>
        <button class="btn btn-petcare" type="submit"><i class="bi bi-check2 me-1"></i>Guardar tutor</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
